name: Factory Quality Gate
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - name: Validate Cloudflare Worker bundle (no deployment)
        run: npm run deploy:cloudflare -- --dry-run --outdir /tmp/fambo-cloudflare-build
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - name: Production API and privacy smoke
        run: python tests/production_smoke.py

  deploy-cloudflare:
    name: Deploy Cloudflare after green gate
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      worker_url: ${{ steps.publish.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Deploy tested commit to Cloudflare Workers
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:cloudflare 2>&1 | tee /tmp/fambo-deploy.log
          worker_url=$(grep -Eo 'https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev' /tmp/fambo-deploy.log | tail -n 1 || true)
          if [[ -z "$worker_url" ]]; then
            echo '::error::Cloudflare did not report a public workers.dev route. Check account subdomain and workers_dev setting.'
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

  verify-cloudflare-live:
    name: Verify Cloudflare live after deploy
    needs: deploy-cloudflare
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check public Worker and safe API responses
        env:
          DEPLOYED_WORKER_URL: ${{ needs.deploy-cloudflare.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="$DEPLOYED_WORKER_URL"
          [[ "$base" =~ ^https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev$ ]] || { echo "::error::Invalid published Worker URL"; exit 1; }
          # DNS/CDN propagation can lag a deploy; retry only read-only GET requests.
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --connect-timeout 6 --max-time 15 "$base/" -o /tmp/fambo-index.html &&
               grep -qi 'Fambo' /tmp/fambo-index.html &&
               curl --fail --silent --show-error --connect-timeout 6 --max-time 15 "$base/api/agent/status" -o /tmp/fambo-agent-status.json &&
               python3 -c 'import json; o=json.load(open("/tmp/fambo-agent-status.json")); assert isinstance(o.get("available"), bool)'; then
              echo "Cloudflare live: HTML and safe API health verified."
              exit 0
            fi
            echo "Cloudflare live check attempt $i/6 did not pass."
            sleep 10
          done
          echo "::error::Cloudflare production URL not reachable or API response invalid"
          exit 1
