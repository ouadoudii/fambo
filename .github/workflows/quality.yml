name: Factory Quality Gate
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - name: Validate Cloudflare Worker bundle (no deployment)
        run: npm run deploy:cloudflare -- --dry-run --outdir /tmp/fambo-cloudflare-build
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - name: Production API and privacy smoke
        run: python tests/production_smoke.py
