<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f1"><title>Fambo – Unser Familienplan</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="top"><div><div class="eyebrow">ZU HAUSE IST, WO WIR ZUSAMMENKOMMEN</div><h1>Unsere Familienwand <span>✺</span></h1><p class="subtitle" id="day-label"></p></div><div class="clock" id="clock"></div></header><div class="bar"><div class="switches"><button id="previous" aria-label="Vorherige Woche">‹</button><strong id="week-label"></strong><button id="next" aria-label="Nächste Woche">›</button><button class="today" id="today">Heute</button></div><button class="settings-button" id="settings">⚙ Einstellungen</button></div><section class="schedules" id="schedules" aria-label="Stundenpläne"></section><footer><span>Mit Liebe organisiert ♡</span><span>WebUntis · automatische Aktualisierung alle 5 Minuten</span></footer></main><dialog id="settings-dialog"><form method="dialog" id="settings-form"><div class="dialog-head"><h2>Familie einrichten</h2><button value="cancel" aria-label="Schließen" class="icon-button">×</button></div><p class="hint">Füge die öffentlichen Stundenplan-Links deiner Kinder ein. Keine Passwörter erforderlich. Die Links bleiben auf diesem Gerät gespeichert.</p><label>Name des ersten Kindes<input name="name0" maxlength="30" required placeholder="Sohn"></label><label>Öffentlicher WebUntis-Link<input name="url0" type="url" placeholder="https://…webuntis.com/WebUntis?school=…" autocomplete="off"></label><label>Name des zweiten Kindes<input name="name1" maxlength="30" required placeholder="Tochter"></label><label>Öffentlicher WebUntis-Link<input name="url1" type="url" placeholder="Link der Tochter"></label><p id="form-error" role="alert" class="error"></p><button value="save" class="primary">Speichern und anzeigen</button></form></dialog><script type="module" src="app.js"></script></body></html>
